[workspace]
resolver = "2"
members = [
	# Library crates
	"crates/reinhardt-cloud",
	"crates/reinhardt-cloud-types",
	"crates/reinhardt-cloud-core",
	"crates/reinhardt-cloud-k8s",
	"crates/reinhardt-cloud-proto",
	"crates/reinhardt-cloud-grpc",
	"crates/reinhardt-cloud-telemetry",
	# Binary crates
	"crates/reinhardt-cloud-operator",
	"crates/reinhardt-cloud-cli",
	"crates/reinhardt-cloud-agent",
	# Control Plane application (Reinhardt Pages)
	"dashboard",
	# Integration tests
	"tests",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/kent8192/reinhardt-cloud"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Kubernetes
kube = { version = "3.0.1", features = ["runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.27.1", features = ["v1_31", "schemars"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Reinhardt — umbrella crate providing: HTTP server, auth (sessions, OAuth 2.0, OIDC provider,
# social login), database (SeaQuery), configuration, DI container, middleware, OpenAPI, i18n, and
# management commands. Direct hyper/sea-query deps are NOT needed — reinhardt provides them.
# Beyond the Control Plane's `auth-oauth` (the OAuth authorization server behind CLI Sessions) and
# `i18n` needs, the remaining features
# are what the Pages scaffold and its `manage` binary require: `commands-contract`,
# `commands-autoreload`, `grpc` (generated app gRPC routers), and `websockets` (generated app
# WebSocket routers); `server`, `pages`, `admin`, `database`, `db-postgres`, `sessions`, `forms`, and
# `client-router` back the web stack, and the rest are retained from the previous crate for the
# milestones that build on them.
reinhardt = { package = "reinhardt-web", version = "=0.4.0-alpha.20", features = ["database", "db-postgres", "auth", "auth-oauth", "auth-social", "social-auth", "core", "conf", "server", "di", "i18n", "middleware", "middleware-security", "rest", "openapi", "openapi-router", "commands-server", "commands-contract", "commands-autoreload", "introspect", "test", "testcontainers", "pages", "forms", "websockets", "grpc", "admin", "sessions", "session-redis", "mail", "static-files", "client-router"] }
# Native `manage` / runserver command support, pinned in lockstep with `reinhardt` and used
# by the dashboard `commands-shell` feature.
reinhardt-commands = { version = "=0.4.0-alpha.20", default-features = false, features = ["shell", "server", "autoreload", "grpc", "websockets"] }

# PostgreSQL driver (sea-query is available via reinhardt::prelude — no direct dep needed)
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"

# Types
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Protobuf
prost-types = "0.13"

# JWT
jsonwebtoken = "9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry (tracing)
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.32"

# CLI
clap = { version = "4", features = ["derive"] }
schemars = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# WebSocket client (Loki /tail live log stream)
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

# Async stream construction (tail_logs streaming)
async-stream = "0.3"

# Internal workspace crates
reinhardt-cloud = { path = "crates/reinhardt-cloud", version = "0.1.0-alpha.2" }
reinhardt-cloud-types = { path = "crates/reinhardt-cloud-types", version = "0.1.0-alpha.2" }
reinhardt-cloud-core = { path = "crates/reinhardt-cloud-core", version = "0.1.0-alpha.2" }
reinhardt-cloud-k8s = { path = "crates/reinhardt-cloud-k8s", version = "0.1.0-alpha.2" }
reinhardt-cloud-proto = { path = "crates/reinhardt-cloud-proto", version = "0.1.0-alpha.2" }
reinhardt-cloud-grpc = { path = "crates/reinhardt-cloud-grpc", version = "0.1.0-alpha.2" }
reinhardt-cloud-telemetry = { path = "crates/reinhardt-cloud-telemetry", version = "0.1.0-alpha.2" }

# Cryptography / encoding
rand = "0.9"

# Testing
rstest = "0.26"
tokio-test = "0.4"
proptest = "1"
testcontainers = "0.27"

[workspace.lints.clippy]
module_name_repetitions = "allow"
