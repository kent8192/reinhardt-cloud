[package]
name = "cloud_dashboard"
description = "Reinhardt Cloud dashboard and control plane"
publish = false
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
default-run = "manage"

[lib]
crate-type = ["cdylib", "rlib"]  # cdylib for WASM, rlib for server

[[bin]]
name = "manage"
path = "src/bin/manage.rs"
required-features = ["with-reinhardt"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
uuid = { version = "1.11", features = ["v4", "v7", "serde", "js"] }
ctor = "0.6"
linkme = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inventory = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
reinhardt = { version = "=0.4.0-alpha.20", package = "reinhardt-web", default-features = false, features = ["pages", "client-router", "i18n"] }
wasm-bindgen = "=0.2.122"
web-sys = { version = "0.3", features = [
	"Window",
	"Document",
	"HtmlDocument",
	"Element",
	"HtmlInputElement",
	"HtmlFormElement",
	"Event",
	"EventTarget",
	"Location",
	"History",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
http = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
serde_urlencoded = "0.7"
thiserror = "2"
reinhardt = { version = "=0.4.0-alpha.20", package = "reinhardt-web", default-features = false, features = ["minimal", "pages", "client-router", "i18n", "conf", "commands", "commands-contract", "commands-server", "server", "websockets", "db-postgres", "forms", "auth-session", "middleware", "argon2-hasher", "static-files"] }
clap = { version = "4", features = ["derive"] }
console = "0.16.1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
cfg_aliases = "0.2"

[features]
default = ["with-reinhardt", "client-router"]
client-router = []
with-reinhardt = []
msw = ["reinhardt/msw"]

[dev-dependencies]
rstest = "0.26.1"
scraper = "0.24"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
testcontainers.workspace = true
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
