[package]
name = "reinhardt-cloud-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Control Plane application for Reinhardt Cloud"
publish = false
default-run = "manage"

[lib]
# The package keeps the `reinhardt-cloud-dashboard` name (image layout and
# release tooling depend on it) while the library uses the project name
# generated by `reinhardt-admin startproject`.
name = "cloud_control_plane"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]  # cdylib for WASM, rlib for server

[[bin]]
name = "manage"
path = "src/bin/manage.rs"
required-features = ["with-reinhardt"]

# Production HTTP server entry point (container ENTRYPOINT). It must stay a thin
# launcher: DI-registered types live in the library crate only.
[[bin]]
name = "reinhardt-cloud-dashboard"
path = "src/main.rs"

[dependencies]
reinhardt = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
inventory = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
web-sys = { version = "0.3", features = [
	"Window",
	"Document",
	"Element",
	"HtmlInputElement",
	"HtmlFormElement",
	"Event",
	"EventTarget",
	"Location",
	"History",
	"Storage",
	"MediaQueryList",
	"Navigator",
	"Clipboard",
	"HtmlDialogElement",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Keep the facade dependency after the native-only commands dependency so
# procedural macros resolve application paths through the cross-target
# `reinhardt` crate name.
reinhardt-commands = { workspace = true, optional = true }
clap = { workspace = true }
console = "0.16.1"
tokio = { workspace = true }
# `#[model]` registers models through these crates.
ctor = "0.6"
linkme = "0.3"
# Provider token encryption (SR-06): RustCrypto AES-256-GCM with a key derived
# by HKDF-SHA256. `reinhardt-conf` only exposes its AEAD behind a feature the
# `reinhardt` facade does not forward, and it offers no associated data.
aes-gcm = "0.10"
async-trait = { workspace = true }
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
# Session and sign-in state live in Redis so every replica sees them (SR-04,
# SR-08). The version and features match the ones `reinhardt-middleware`
# compiles, so the facade's Redis session backend and this client share one build.
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp", "connection-manager"] }
# Calls GitHub for the signing-in User's profile and organizations, and refreshes
# provider tokens (reinhardt-web#6709); `rustls-tls` keeps TLS off the system store.
reqwest = { workspace = true }
rand = { workspace = true }

[build-dependencies]
cfg_aliases = "0.2"

[features]
default = ["with-reinhardt", "client-router"]
client-router = []
commands-shell = ["reinhardt/commands", "reinhardt/database", "reinhardt/di", "dep:reinhardt-commands"]
with-reinhardt = []
msw = ["reinhardt/msw"]

[dev-dependencies]
rstest = { workspace = true }
serial_test = "3.2"

# Browser tests run under `wasm-pack test`; Cargo does not auto-discover test
# files under `tests/<subdir>/`, so the target is declared explicitly below.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
# Local stand-in for GitHub; GitHub is never called for real in tests.
wiremock = "0.6"
# Captures `audit` events in tests.
tracing-subscriber = { workspace = true }
# Parses the committed settings profiles in tests.
toml = { workspace = true }

# Browser-only test target: the file is `#![cfg(client)]`, so it compiles to
# nothing on native targets and runs under `cargo make wasm-test`.
[[test]]
name = "components_browser"
path = "tests/wasm/components_browser.rs"

# Native test targets are skipped by `wasm-pack test --no-default-features`,
# which builds every test target for wasm32.
[[test]]
name = "integration"
required-features = ["with-reinhardt"]

[[test]]
name = "components"
required-features = ["with-reinhardt"]

[[test]]
name = "client_form_styling"
required-features = ["with-reinhardt"]

[[test]]
name = "i18n"
required-features = ["with-reinhardt"]
