[package]
name = "reinhardt-cloud-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Control Plane application for Reinhardt Cloud"
publish = false
default-run = "manage"

[lib]
# The package keeps the `reinhardt-cloud-dashboard` name (image layout and
# release tooling depend on it) while the library uses the project name
# generated by `reinhardt-admin startproject`.
name = "cloud_control_plane"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]  # cdylib for WASM, rlib for server

[[bin]]
name = "manage"
path = "src/bin/manage.rs"
required-features = ["with-reinhardt"]

# Production HTTP server entry point (container ENTRYPOINT). It must stay a thin
# launcher: DI-registered types live in the library crate only.
[[bin]]
name = "reinhardt-cloud-dashboard"
path = "src/main.rs"

[dependencies]
reinhardt = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
inventory = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
web-sys = { version = "0.3", features = [
	"Window",
	"Document",
	"Element",
	"HtmlInputElement",
	"HtmlFormElement",
	"Event",
	"EventTarget",
	"Location",
	"History",
	"Storage",
	"MediaQueryList",
	"Navigator",
	"Clipboard",
	"HtmlDialogElement",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Keep the facade dependency after the native-only commands dependency so
# procedural macros resolve application paths through the cross-target
# `reinhardt` crate name.
reinhardt-commands = { workspace = true, optional = true }
clap = { workspace = true }
console = "0.16.1"
tokio = { workspace = true }

[build-dependencies]
cfg_aliases = "0.2"

[features]
default = ["with-reinhardt", "client-router"]
client-router = []
commands-shell = ["reinhardt/commands", "reinhardt/database", "reinhardt/di", "dep:reinhardt-commands"]
with-reinhardt = []
msw = ["reinhardt/msw"]

[dev-dependencies]
rstest = { workspace = true }
serial_test = "3.2"

# Browser tests run under `wasm-pack test`; Cargo does not auto-discover test
# files under `tests/<subdir>/`, so the target is declared explicitly below.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }

# Browser-only test target: the file is `#![cfg(client)]`, so it compiles to
# nothing on native targets and runs under `cargo make wasm-test`.
[[test]]
name = "ui_browser"
path = "tests/wasm/ui_browser.rs"

# Native test targets are skipped by `wasm-pack test --no-default-features`,
# which builds every test target for wasm32.
[[test]]
name = "integration"
required-features = ["with-reinhardt"]

[[test]]
name = "ui_components"
required-features = ["with-reinhardt"]

[[test]]
name = "i18n"
required-features = ["with-reinhardt"]
