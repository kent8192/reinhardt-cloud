[package]
name = "reinhardt-cloud-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Control Plane application for Reinhardt Cloud"
publish = false
default-run = "manage"

[lib]
# The package keeps the `reinhardt-cloud-dashboard` name (image layout and
# release tooling depend on it) while the library uses the project name
# generated by `reinhardt-admin startproject`.
name = "cloud_control_plane"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]  # cdylib for WASM, rlib for server

[[bin]]
name = "manage"
path = "src/bin/manage.rs"
required-features = ["with-reinhardt"]

# Production HTTP server entry point (container ENTRYPOINT). It must stay a thin
# launcher: DI-registered types live in the library crate only.
[[bin]]
name = "reinhardt-cloud-dashboard"
path = "src/main.rs"

[dependencies]
reinhardt = { workspace = true }
chrono = { workspace = true }
rust_decimal = "1"
uuid = { workspace = true }
ctor = "0.6"
linkme = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
inventory = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
web-sys = { version = "0.3", features = [
	"Window",
	"Document",
	"Element",
	"HtmlInputElement",
	"HtmlFormElement",
	"Event",
	"EventTarget",
	"Location",
	"History",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Keep the facade dependency after the native-only commands dependency so
# procedural macros resolve application paths through the cross-target
# `reinhardt` crate name.
reinhardt-commands = { version = "=0.4.0-alpha.20", default-features = false, features = ["shell", "server", "autoreload", "grpc", "websockets"], optional = true }
clap = { workspace = true }
console = "0.16.1"
tokio = { workspace = true }

[build-dependencies]
cfg_aliases = "0.2"

[features]
default = ["with-reinhardt", "client-router"]
client-router = []
commands-shell = ["reinhardt/commands", "reinhardt/database", "reinhardt/di", "dep:reinhardt-commands"]
with-reinhardt = []
msw = ["reinhardt/msw"]

[dev-dependencies]
rstest = { workspace = true }
serial_test = "3.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
