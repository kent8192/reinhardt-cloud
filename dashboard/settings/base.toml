# Base Settings for the Control Plane
#
# Common configuration for every environment. Profile files (`local.toml`,
# `ci.toml`, `staging.toml`, `production.toml`) override individual keys;
# process environment variables with the `REINHARDT_` prefix override both.
#
# This file is tracked and must never contain literal secrets. Secrets and
# deployment-specific values arrive through the environment, using the names
# the operator injects:
#   REINHARDT_CORE__SECRET_KEY        required
#   REINHARDT_DATABASE_PASSWORD       required
#   REINHARDT_DATABASE_{HOST,PORT,NAME,USER}   optional, local defaults below
#   REINHARDT_CLOUD_REDIS_URL         required in staging and production; the
#                                     operator injects it with the Redis
#                                     password already expanded
#   REINHARDT_CLOUD_SIGN_UP_POLICY    optional: open | allowlist | invite_only
#                                     (default; anything else means invite_only)
#   REINHARDT_CLOUD_SIGN_UP_ALLOWED_GITHUB_USER_IDS
#   REINHARDT_CLOUD_SIGN_UP_ALLOWED_GITHUB_ORGANIZATION_IDS
#                                     optional comma-separated numeric GitHub IDs
#   REINHARDT_CLOUD_TOKEN_ENCRYPTION_KEY
#                                     optional base64 of 32 random bytes; without
#                                     it the provider-token key is derived from
#                                     REINHARDT_CORE__SECRET_KEY
#   REINHARDT_CLOUD_TOKEN_ENCRYPTION_KEY_ID, REINHARDT_CLOUD_TOKEN_ENCRYPTION_RETIRED_KEYS
#                                     optional, for key rotation
#   REINHARDT_CLOUD_GITHUB_CLIENT_ID, REINHARDT_CLOUD_GITHUB_CLIENT_SECRET
#                                     the GitHub App behind sign-in; set together,
#                                     and required in staging and production
#   REINHARDT_CLOUD_GITHUB_SIGN_IN    `disabled` runs without GitHub sign-in (only
#                                     Login Links can sign in); the only way a
#                                     deployed profile starts without the App
#   REINHARDT_CLOUD_PUBLIC_URL        origin the Dashboard is served from; the
#                                     GitHub callback and the cross-site request
#                                     allow-list derive from it
#   REINHARDT_CLOUD_ALLOWED_ORIGINS   optional comma-separated extra origins
#   REINHARDT_CLOUD_TRUSTED_PROXIES   optional comma-separated IP addresses of the
#                                     TLS-terminating proxies in front of the
#                                     Control Plane; needed for HSTS behind one
#   REINHARDT_CLOUD_GITHUB_{AUTHORIZE,TOKEN,API}_URL
#                                     optional endpoint overrides (tests only)

[core]
debug = false
secret_key = "${REINHARDT_CORE__SECRET_KEY:?must be set to a unique cryptographically random value}"
allowed_hosts = []
language_code = "en-us"
time_zone = "UTC"
use_i18n = true
use_tz = true
default_auto_field = "BigAutoField"
middleware = []
root_urlconf = ""

[core.security]
session_cookie_secure = false
csrf_cookie_secure = false
secure_ssl_redirect = false
secure_hsts_seconds = 0
secure_hsts_include_subdomains = false
secure_hsts_preload = false
append_slash = true

[core.databases.default]
engine = "postgresql"
host = "${REINHARDT_DATABASE_HOST:-localhost}"
port = "${REINHARDT_DATABASE_PORT:-5432}"
name = "${REINHARDT_DATABASE_NAME:-reinhardt_cloud}"
user = "${REINHARDT_DATABASE_USER:-postgres}"
password = "${REINHARDT_DATABASE_PASSWORD:?must be set to the database password}"

[accounts]
sign_up_policy = "${REINHARDT_CLOUD_SIGN_UP_POLICY:-invite_only}"
sign_up_allowed_github_user_ids = "${REINHARDT_CLOUD_SIGN_UP_ALLOWED_GITHUB_USER_IDS:-}"
sign_up_allowed_github_organization_ids = "${REINHARDT_CLOUD_SIGN_UP_ALLOWED_GITHUB_ORGANIZATION_IDS:-}"
token_encryption_key = "${REINHARDT_CLOUD_TOKEN_ENCRYPTION_KEY:-}"
token_encryption_key_id = "${REINHARDT_CLOUD_TOKEN_ENCRYPTION_KEY_ID:-}"
token_encryption_retired_keys = "${REINHARDT_CLOUD_TOKEN_ENCRYPTION_RETIRED_KEYS:-}"
public_url = "${REINHARDT_CLOUD_PUBLIC_URL:-}"
allowed_origins = "${REINHARDT_CLOUD_ALLOWED_ORIGINS:-}"
trusted_proxies = "${REINHARDT_CLOUD_TRUSTED_PROXIES:-}"
github_sign_in = "${REINHARDT_CLOUD_GITHUB_SIGN_IN:-}"
github_client_id = "${REINHARDT_CLOUD_GITHUB_CLIENT_ID:-}"
github_client_secret = "${REINHARDT_CLOUD_GITHUB_CLIENT_SECRET:-}"
github_authorize_url = "${REINHARDT_CLOUD_GITHUB_AUTHORIZE_URL:-}"
github_token_url = "${REINHARDT_CLOUD_GITHUB_TOKEN_URL:-}"
github_api_url = "${REINHARDT_CLOUD_GITHUB_API_URL:-}"

[redis]
url = "${REINHARDT_CLOUD_REDIS_URL:-redis://127.0.0.1:6379/0}"

[static]
url = "/static/"
root = "dist"

[ws_origin]
policy = { mode = "allow_list", origins = ["http://127.0.0.1:8000", "http://localhost:8000"] }
reject_missing_origin = true

[contacts]
admins = []
managers = []
