# Local Development Settings
#
# Copy this file to `local.toml` (ignored by git) to override `base.toml` for
# local development. Keep real secrets out of this file: export
# REINHARDT_CORE__SECRET_KEY and REINHARDT_DATABASE_PASSWORD in your shell
# instead, and point REINHARDT_DATABASE_HOST/PORT at your local PostgreSQL.
# The Redis URL below has no credentials; a local Redis needs none.

[core]
debug = true
allowed_hosts = ["localhost", "127.0.0.1"]

# Sign-in needs a GitHub App whose callback URL is
# `http://localhost:8000/api/auth/github/callback/`. Export
# REINHARDT_CLOUD_GITHUB_CLIENT_ID and REINHARDT_CLOUD_GITHUB_CLIENT_SECRET.
[accounts]
public_url = "http://localhost:8000"

# The dev container reaches Redis by its service name (`RC_REDIS_HOST=redis`);
# host-native development falls back to localhost.
[redis]
url = "redis://${RC_REDIS_HOST:-localhost}:6379/0"
