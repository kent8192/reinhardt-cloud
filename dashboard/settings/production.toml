# Production Environment Settings
#
# Loaded when REINHARDT_ENV=production. Overrides `base.toml` key by key.
# Secrets come from the environment; see `base.toml` for the variable names.
# Startup fails unless the profile is hardened (see `config::settings`).

[core]
debug = false
allowed_hosts = ["reinhardt-cloud.dev", "www.reinhardt-cloud.dev"]

[core.security]
session_cookie_secure = true
csrf_cookie_secure = true
secure_ssl_redirect = true
secure_hsts_seconds = 31536000
secure_hsts_include_subdomains = true
secure_hsts_preload = true

[redis]
url = "${REINHARDT_CLOUD_REDIS_URL:?must be set to the Redis URL, including credentials}"

[ws_origin]
policy = { mode = "allow_list", origins = ["https://reinhardt-cloud.dev", "https://www.reinhardt-cloud.dev"] }
reject_missing_origin = true
